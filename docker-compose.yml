services:
  ai-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # Maps your local invoice folder to the container
    environment:
      - DATABASE_URL=sqlite:////app/data/invoices.db
    restart: always

